<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBF7F2">
<title>Biblio Discover</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Biblio "soft" theme: cream canvas, white cards, rose for love, sage for calm ── */
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --ink:#2C292C; --muted:#6B6D69; --line:rgba(44,41,44,.08);
  --green:#313C33; --sage:#7F9D98; --sage-ink:#3F6863; --sage-soft:#E7EFED;
  --rose:#c7a9b5; --rose-ink:#9B5872; --rose-soft:#F6EBF0;
  --blue:#5C7EA0; --blue-ink:#2F5579; --blue-soft:#E6EDF5;
  --olive:#555B3F; --olive-soft:#EEEFE4;
  --pepper:#C2563E; --star:#C98A1B;
  --r-lg:28px; --r-md:20px;
  --shadow:0 1px 2px rgba(44,41,44,.04),0 8px 24px rgba(44,41,44,.07);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#E9E3DA;display:flex;align-items:center;justify-content:center;min-height:100vh;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:12px;}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.125em;fill:currentColor;flex-shrink:0;}

.phone{width:390px;height:min(844px,calc(100vh - 32px));background:var(--bg);border-radius:46px;overflow:hidden;position:relative;
  box-shadow:0 40px 120px rgba(49,60,51,.35),0 0 0 10px #fff,0 0 0 11px rgba(0,0,0,.06);display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;}
@media (max-width:500px){body{display:block;background:var(--bg);}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;}}

/* ── Top bar ── */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 44px) 18px 8px 22px;flex-shrink:0;}
.wordmark{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:28px;color:var(--green);letter-spacing:-.01em;}
.wordmark i{color:var(--rose);font-style:normal;}
.top-actions{display:flex;gap:6px;align-items:center;}
.chip-btn{height:40px;min-width:40px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;font-size:20px;color:var(--green);padding:0 10px;transition:transform .15s;}
.chip-btn:active{transform:scale(.92);}
.chip-btn:disabled{opacity:.35;}
.chip-btn .n{font-size:13px;font-weight:800;}
.shelf-btn.bump{animation:bump .5s ease;}
@keyframes bump{30%{transform:scale(1.25)}60%{transform:scale(.95)}}

/* ── Feed ── */
.feed-wrap{flex:1;min-height:0;position:relative;overflow:hidden;}
.feed{position:absolute;inset:0;overflow-y:auto;padding:4px 16px 120px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.feed::-webkit-scrollbar{display:none;}
.feed.out-left{animation:outLeft .32s ease forwards;}
.feed.in-right{animation:inRight .38s cubic-bezier(.2,.8,.2,1);}
.feed.in-left{animation:inLeft .38s cubic-bezier(.2,.8,.2,1);}
@keyframes outLeft{to{transform:translateX(-40px) rotate(-2deg);opacity:0}}
@keyframes inRight{from{transform:translateX(40px);opacity:0}}
@keyframes inLeft{from{transform:translateX(-40px);opacity:0}}

.p-head{padding:6px 6px 14px;position:relative;}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--rose-ink);background:var(--rose-soft);border-radius:20px;padding:5px 11px;margin-bottom:10px;}
.p-head h1{font-family:'Fraunces',serif;font-weight:600;font-size:34px;line-height:1.05;letter-spacing:-.02em;color:var(--green);margin-bottom:4px;padding-right:48px;}
.by{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:12px;}
.facts{display:flex;flex-wrap:wrap;gap:6px;}
.fact{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--card);border-radius:20px;padding:6px 11px;box-shadow:0 1px 2px rgba(44,41,44,.05);}
.fact .ic{font-size:14px;}
.fact.star .ic{color:var(--star);}
.fact.spice .ic{color:var(--pepper);}
.more{position:absolute;right:0;top:4px;width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--muted);display:flex;align-items:center;justify-content:center;}
.menu{position:absolute;right:4px;top:48px;background:var(--card);border-radius:16px;box-shadow:0 12px 40px rgba(44,41,44,.18);padding:6px;z-index:20;display:none;min-width:190px;}
.menu.show{display:block;animation:pop .2s ease;}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:10px;font-size:14px;font-weight:700;text-align:left;}
.menu button:hover{background:var(--bg);}
.menu .ic{font-size:18px;color:var(--sage-ink);}

/* Modules: every one is a white rounded card with its own heart */
.m{position:relative;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);margin-bottom:14px;}
.m-lbl{font-size:12px;font-weight:800;color:var(--sage-ink);letter-spacing:.02em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.m-lbl .ic{font-size:15px;}
.like{position:absolute;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:0 2px 6px rgba(44,41,44,.08),0 6px 18px rgba(44,41,44,.12);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--rose-ink);transition:transform .15s;z-index:3;}
.like:active{transform:scale(.88);}
.like:hover{background:var(--rose-soft);}

.cover-card{padding:0;overflow:hidden;aspect-ratio:4/4.6;}
.cover-bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.2);opacity:.55;transform:scale(1.1);}
.cover-tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,247,242,.1),rgba(251,247,242,.5));}
.cover-book{position:absolute;left:50%;top:50%;width:54%;aspect-ratio:2/3;transform:translate(-50%,-52%) rotate(-2deg);border-radius:6px 12px 12px 6px;overflow:hidden;
  box-shadow:-6px 0 0 -2px rgba(0,0,0,.08) inset,0 18px 40px rgba(44,41,44,.32),0 2px 6px rgba(44,41,44,.2);}
.cover-book img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;}
.cover-fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:18px 14px;color:#fff;}
.cover-fallback .t{font-family:'Fraunces',serif;font-weight:600;font-size:21px;line-height:1.1;}
.cover-fallback .a{font-size:11px;font-weight:700;opacity:.9;letter-spacing:.04em;text-transform:uppercase;}
.cover-hint{position:absolute;left:16px;bottom:22px;font-size:11px;font-weight:700;color:var(--green);background:rgba(255,255,255,.75);backdrop-filter:blur(6px);border-radius:20px;padding:5px 10px;z-index:2;}
.burst{position:absolute;left:50%;top:50%;font-size:110px;color:#fff;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;z-index:4;filter:drop-shadow(0 6px 20px rgba(155,88,114,.5));}
.burst.go{animation:burst .8s ease forwards;}
@keyframes burst{15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(.95)}45%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}

.prompt{padding:20px 20px 74px;}
.prompt .big{font-family:'Fraunces',serif;font-size:25px;line-height:1.22;font-weight:500;color:var(--green);letter-spacing:-.01em;}
.prompt.rose{background:var(--rose-soft);}
.prompt.rose .m-lbl{color:var(--rose-ink);}
.prompt.quote .big{font-style:italic;font-size:22px;}
.prompt.quote .qmark{font-family:'Fraunces',serif;font-size:64px;line-height:.6;color:var(--rose);display:block;height:26px;}

.vibes{padding:20px 20px 74px;}
.vibe-row{display:flex;flex-wrap:wrap;gap:8px;}
.vibe{font-size:14px;font-weight:700;border-radius:22px;padding:9px 14px;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,box-shadow .15s;}
.vibe:active{transform:scale(.95);}
.vibe[aria-pressed="true"]{box-shadow:0 0 0 2px currentColor inset;}
.vibe .ic{font-size:14px;display:none;}
.vibe[aria-pressed="true"] .ic{display:inline-block;}
.v0{background:var(--sage-soft);color:var(--sage-ink);} .v1{background:var(--rose-soft);color:var(--rose-ink);}
.v2{background:var(--blue-soft);color:var(--blue-ink);} .v3{background:var(--olive-soft);color:var(--olive);}
.vibe-tip{font-size:12px;color:var(--muted);margin-top:10px;font-weight:600;}

.review{padding:20px 20px 74px;}
.bubble{background:var(--bg);border-radius:20px 20px 20px 6px;padding:14px 16px;font-size:15.5px;line-height:1.45;font-weight:600;}
.who{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);font-weight:700;}
.who .dot{width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:flex;align-items:center;justify-content:center;font-size:13px;}
.sample{font-size:10px;font-weight:800;color:var(--muted);background:var(--bg);border-radius:10px;padding:2px 7px;margin-left:auto;}

.author{padding:20px;display:flex;gap:14px;}
.author .av{width:52px;height:52px;border-radius:50%;background:var(--sage-soft);color:var(--sage-ink);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:22px;font-weight:600;flex-shrink:0;}
.author h3{font-family:'Fraunces',serif;font-weight:600;font-size:18px;color:var(--green);margin-bottom:4px;}
.author p{font-size:13.5px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.author p.open{-webkit-line-clamp:unset;}
.author .rm{font-size:13px;font-weight:800;color:var(--sage-ink);margin-top:6px;padding:6px 0;}
.feed-end{text-align:center;font-size:13px;color:var(--muted);font-weight:700;padding:10px 0 20px;}

/* ── Pass FAB (Hinge-style, bottom-left) ── */
.pass{position:absolute;left:18px;bottom:96px;z-index:30;width:62px;height:62px;border-radius:50%;background:var(--card);
  box-shadow:0 2px 6px rgba(44,41,44,.1),0 10px 28px rgba(44,41,44,.18);font-size:28px;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.pass:active{transform:scale(.9) rotate(-8deg);}
.pass-lbl{position:absolute;left:18px;width:62px;bottom:80px;text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);z-index:30;}

/* ── Nav ── */
.nav{display:flex;justify-content:space-around;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 10px calc(var(--safe-bot) + 14px);flex-shrink:0;position:relative;z-index:40;}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;min-height:48px;padding-top:4px;font-size:11px;font-weight:800;color:var(--muted);}
.ni .ic{font-size:26px;}
.ni[aria-current="page"]{color:var(--green);}
.ni[aria-current="page"] .pip{width:5px;height:5px;border-radius:50%;background:var(--rose);margin-top:1px;}

/* ── Like sheet (Hinge's "like + comment") ── */
.scrim{position:absolute;inset:0;background:rgba(44,41,44,.32);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 20px calc(var(--safe-bot) + 22px);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);visibility:hidden;}
.sheet.show{transform:none;visibility:visible;}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(44,41,44,.15);margin:0 auto 14px;}
.sheet h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:var(--green);line-height:1.15;margin-bottom:4px;}
.sheet .sub{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:14px;}
.liked-preview{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px;display:flex;gap:12px;align-items:center;}
.liked-preview .lp-ic{width:40px;height:40px;border-radius:50%;background:var(--rose-soft);color:var(--rose-ink);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.liked-preview .lp-t{font-size:12px;font-weight:800;color:var(--rose-ink);}
.liked-preview .lp-b{font-family:'Fraunces',serif;font-size:16px;color:var(--green);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.note{width:100%;min-height:48px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:12px 14px;font-family:inherit;font-size:15px;color:var(--ink);outline:none;margin-bottom:14px;user-select:text;-webkit-user-select:text;}
.note:focus{border-color:var(--rose);}
.btn{width:100%;min-height:52px;border-radius:26px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s;}
.btn:active{transform:scale(.97);}
.btn-rose{background:var(--green);color:#fff;}
.btn-rose .ic{color:var(--rose);font-size:20px;}
.btn-quiet{color:var(--muted);margin-top:4px;min-height:44px;font-size:14px;}

/* ── Match moment ── */
.moment{position:absolute;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;opacity:0;pointer-events:none;transition:opacity .25s;overflow:hidden;}
.moment.show{opacity:1;pointer-events:auto;}
.duo{display:flex;align-items:flex-end;gap:0;margin-bottom:22px;position:relative;}
.duo .mini{width:96px;aspect-ratio:2/3;border-radius:6px 12px 12px 6px;overflow:hidden;box-shadow:0 14px 30px rgba(44,41,44,.25);transform:rotate(6deg) translateX(-8px);position:relative;background:var(--sage);}
.duo .mini img{width:100%;height:100%;object-fit:cover;}
.mascot{width:120px;height:120px;transform:translateX(10px);}
.moment.show .mascot .bob{animation:bob 1.2s ease-in-out infinite;transform-origin:60px 100px;}
.moment.show .duo{animation:pop .5s cubic-bezier(.2,1.4,.4,1);}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.moment h2{font-family:'Fraunces',serif;font-weight:600;font-size:32px;color:var(--green);letter-spacing:-.02em;margin-bottom:8px;}
.moment p{font-size:15px;color:var(--muted);font-weight:600;line-height:1.5;margin-bottom:6px;max-width:280px;}
.moment .why{font-size:13px;color:var(--rose-ink);font-weight:800;margin-bottom:26px;}
.moment .btn{max-width:280px;}
.confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;opacity:0;}
.moment.show .confetti{animation:fall 2.4s cubic-bezier(.3,.6,.4,1) forwards;}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(var(--dy)) translateX(var(--dx)) rotate(var(--rot))}}

.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,16px);background:var(--green);color:#fff;font-size:13.5px;font-weight:700;border-radius:22px;padding:11px 16px;z-index:90;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;}
.toast.show{opacity:1;transform:translate(-50%,0);}

.coach{position:absolute;left:96px;right:14px;bottom:92px;z-index:45;background:var(--green);color:#fff;border-radius:20px;padding:14px 16px;font-size:13.5px;font-weight:600;line-height:1.45;box-shadow:0 12px 30px rgba(49,60,51,.35);display:flex;gap:12px;align-items:flex-start;}
.coach .ic{font-size:22px;color:var(--rose);margin-top:1px;}
.coach button{color:var(--rose);font-weight:800;font-size:13px;margin-left:auto;padding:4px 2px;white-space:nowrap;}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>
<div class="phone" id="app">
  <header class="top">
    <div class="wordmark" aria-label="Biblio">biblio<i>.</i></div>
    <div class="top-actions">
      <button class="chip-btn" id="undoBtn" aria-label="Undo" disabled data-ic="arrow-counter-clockwise"></button>
      <button class="chip-btn" aria-label="Filters and spoiler settings" data-ic="sliders-horizontal"></button>
      <button class="chip-btn shelf-btn" id="shelfBtn" aria-label="Your shelf, 0 books"><span data-ic="bookmark-simple"></span><span class="n" id="shelfN">0</span></button>
    </div>
  </header>

  <div class="coach" id="coach" role="note">
    <span data-ic="heart-fill"></span>
    <span>Tap the <b>heart</b> on whatever catches your eye (the plot, a vibe, a quote) to add the book to your shelf. Double-tap the cover works too.</span>
    <button id="coachOk">Got it</button>
  </div>

  <div class="feed-wrap"><main class="feed" id="feed" aria-live="polite"></main></div>

  <button class="pass" id="passBtn" aria-label="Not for me, show the next book" data-ic="x"></button>
  <div class="pass-lbl" aria-hidden="true">Not for me</div>

  <nav class="nav" aria-label="Main">
    <button class="ni"><span data-ic="house"></span>Home</button>
    <button class="ni" aria-current="page"><span data-ic="cards-fill"></span>Discover<span class="pip"></span></button>
    <button class="ni"><span data-ic="user-circle"></span>Me</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sheetT">Add to your shelf?</h2>
    <div class="sub" id="sheetSub"></div>
    <div class="liked-preview"><div class="lp-ic" data-ic="heart-fill"></div><div><div class="lp-t" id="lpT"></div><div class="lp-b" id="lpB"></div></div></div>
    <input class="note" id="note" placeholder="Note to future you (optional)" aria-label="Note to future you" maxlength="120">
    <button class="btn btn-rose" id="confirmBtn"><span data-ic="heart-fill"></span>Add to my shelf</button>
    <button class="btn btn-quiet" id="cancelBtn">Keep browsing</button>
  </section>

  <section class="moment" id="moment" role="dialog" aria-modal="true" aria-labelledby="momentT">
    <div class="duo">
      <div class="mini" id="momentCover"></div>
      <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="110" rx="30" ry="5" fill="#2C292C" opacity=".08"/>
        <g class="bob">
          <rect x="30" y="20" width="62" height="84" rx="12" fill="#7F9D98"/>
          <rect x="30" y="20" width="12" height="84" rx="6" fill="#5F817C"/>
          <rect x="84" y="20" width="8" height="84" rx="3" fill="#F3EEE6"/>
          <path d="M70 14h10v26l-5-5-5 5z" fill="#c7a9b5"/>
          <ellipse cx="56" cy="58" rx="3.6" ry="4.6" fill="#2C292C"/>
          <ellipse cx="74" cy="58" rx="3.6" ry="4.6" fill="#2C292C"/>
          <circle cx="57.2" cy="56.4" r="1.2" fill="#fff"/><circle cx="75.2" cy="56.4" r="1.2" fill="#fff"/>
          <circle cx="50" cy="68" r="5" fill="#E9B9C8" opacity=".9"/><circle cx="80" cy="68" r="5" fill="#E9B9C8" opacity=".9"/>
          <path d="M59 67q6 7 12 0" fill="none" stroke="#2C292C" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M24 46q-8 6-4 14" fill="none" stroke="#5F817C" stroke-width="4" stroke-linecap="round"/>
          <path d="M98 46q10-4 12-14" fill="none" stroke="#5F817C" stroke-width="4" stroke-linecap="round"/>
        </g>
        <path d="M104 18l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#c7a9b5"/>
        <path d="M16 28l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#5C7EA0"/>
      </svg>
    </div>
    <h2 id="momentT">On your shelf!</h2>
    <p id="momentP"></p>
    <div class="why" id="momentWhy"></div>
    <button class="btn btn-rose" id="momentBtn">Keep browsing</button>
  </section>

  <div class="toast" id="toast" role="status"></div>
</div>

const ic=(n,label)=>`<svg class="ic" viewBox="0 0 256 256" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>${ICONS[n]}</svg>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const hydrateIcons=root=>root.querySelectorAll('[data-ic]').forEach(el=>{el.insertAdjacentHTML('afterbegin',ic(el.dataset.ic));el.removeAttribute('data-ic');});
hydrateIcons(document);

const COVER_TINTS=[['#7F9D98','#4F7570'],['#c7a9b5','#9B5872'],['#5C7EA0','#2F5579'],['#555B3F','#3B402B'],['#313C33','#1E2620']];
const fmt=n=>n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M':Math.round(n/1e3)+'K';
let idx=0,shelf=[],past=[],liked=null;

function coverHtml(b,i){
  const [c1,c2]=COVER_TINTS[i%COVER_TINTS.length];
  return `<div class="cover-fallback" style="background:linear-gradient(160deg,${c1},${c2})"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div></div><img src="${esc(b.img)}" alt="" onerror="this.remove()" draggable="false">`;
}
function render(dir){
  const b=BOOKS[idx%BOOKS.length],feed=$('#feed');
  const vibes=b.tags.filter(t=>t!=='Series'&&t!=='Standalone');
  const kick=[b.genre==='Science Fiction'?'Sci-Fi':b.genre,vibes[0]].filter(Boolean).join(' · ');
  let h=`<section class="p-head">
    <div class="kicker">${ic('sparkle-fill')} Picked for you · ${esc(kick)}</div>
    <h1>${esc(b.title)}</h1><div class="by">${esc(b.author)}</div>
    <div class="facts">
      <span class="fact star">${ic('star-fill')} ${b.rating} <span style="color:var(--muted);font-weight:600">(${fmt(b.reviewsRaw)})</span></span>
      <span class="fact">${ic('book-open')} ${b.pages} pages</span>
      <span class="fact">${ic('clock')} ${b.year}</span>
      ${b.spice?`<span class="fact spice" aria-label="Spice ${b.spice} of 5">${ic('pepper-fill').repeat(b.spice)}</span>`:''}
    </div>
    <button class="more" id="moreBtn" aria-label="More options" aria-expanded="false">${ic('dots-three')}</button>
    <div class="menu" id="menu"><button data-act="read">${ic('check-circle')} I've already read it</button><button data-act="skip">${ic('clock')} Ask me later</button></div>
  </section>
  <figure class="m cover-card" id="coverCard">
    <div class="cover-bg" style="background-image:url('${esc(b.img)}')"></div><div class="cover-tint"></div>
    <div class="cover-book">${coverHtml(b,idx)}</div>
    <span class="cover-hint">Double-tap to like</span>
    <span class="burst" id="burst">${ic('heart-fill')}</span>
    <button class="like" data-like="cover" aria-label="Like the cover">${ic('heart')}</button>
  </figure>`;
  if(b.plot)h+=`<div class="m prompt"><div class="m-lbl">${ic('sparkle')} Poorly explained plot</div><p class="big">${esc(b.plot)}</p><button class="like" data-like="plot" aria-label="Like the plot">${ic('heart')}</button></div>`;
  if(vibes.length)h+=`<div class="m vibes"><div class="m-lbl">${ic('books')} The vibe</div><div class="vibe-row">${vibes.map((v,i)=>`<button class="vibe v${i%4}" aria-pressed="false" data-vibe="${esc(v)}">${ic('heart-fill')}${esc(v)}</button>`).join('')}</div><div class="vibe-tip">Tap the vibes you're into, then heart the card.</div><button class="like" data-like="vibes" aria-label="Like the vibe">${ic('heart')}</button></div>`;
  if(b.quote||b.opening)h+=`<div class="m prompt rose quote"><div class="m-lbl">${ic('quotes')} ${b.opening?'Iconic opening line':'A line that lives rent-free'}</div><span class="qmark" aria-hidden="true">“</span><p class="big">${esc(b.opening||b.quote)}</p><button class="like" data-like="quote" aria-label="Like the quote">${ic('heart')}</button></div>`;
  if(b.review1){const who=(b.review1.source.match(/@\w+/)||['a reader'])[0];
    h+=`<div class="m review"><div class="m-lbl">${ic('chat-circle')} A reader says</div><div class="bubble">“${esc(b.review1.text)}”</div><div class="who"><span class="dot">${ic('feather')}</span>${esc(who)}<span class="sample">SAMPLE</span></div><button class="like" data-like="review" aria-label="Like this review">${ic('heart')}</button></div>`;}
  if(b.aboutAuthor)h+=`<div class="m author"><div class="av" aria-hidden="true">${esc(b.author[0])}</div><div><h3>${esc(b.author)}</h3><p id="bio">${esc(b.aboutAuthor)}</p><button class="rm" id="bioMore">Read more</button></div></div>`;
  h+=`<div class="feed-end">That's ${esc(b.title)} in a nutshell ✨</div>`;
  feed.innerHTML=h;feed.scrollTop=0;
  feed.classList.remove('out-left','in-right','in-left');void feed.offsetWidth;
  if(dir)feed.classList.add(dir>0?'in-right':'in-left');
  $('#undoBtn').disabled=!past.length;
  wireCard(b);
}
function wireCard(b){
  // double-tap cover (works with mouse dblclick and touch)
  let last=0;
  $('#coverCard').addEventListener('pointerup',e=>{if(e.target.closest('.like'))return;const t=Date.now();if(t-last<320){burst();openLike('cover');last=0;}else last=t;});
  $('#moreBtn').onclick=e=>{const m=$('#menu');const s=!m.classList.contains('show');m.classList.toggle('show',s);e.currentTarget.setAttribute('aria-expanded',s);};
  $('#menu').onclick=e=>{const a=e.target.closest('[data-act]');if(!a)return;toast(a.dataset.act==='read'?'Marked as read. Nice!':"We'll bring it back later");next('skip');};
  const bm=$('#bioMore');if(bm)bm.onclick=()=>{$('#bio').classList.toggle('open');bm.textContent=$('#bio').classList.contains('open')?'Show less':'Read more';};
}
function burst(){const el=$('#burst');el.classList.remove('go');void el.offsetWidth;el.classList.add('go');}

const LIKE_COPY={cover:['the cover','Judging a book by its cover? We approve.'],plot:['the plot',null],vibes:['the vibe',null],quote:['this line',null],review:['what a reader said',null]};
function openLike(kind){
  const b=BOOKS[idx%BOOKS.length];liked=kind;
  let body=LIKE_COPY[kind][1];
  if(kind==='plot')body=b.plot;
  if(kind==='quote')body=b.opening||b.quote;
  if(kind==='review')body=b.review1.text;
  if(kind==='vibes'){const sel=[...document.querySelectorAll('.vibe[aria-pressed="true"]')].map(x=>x.dataset.vibe);body=(sel.length?sel:b.tags.filter(t=>t!=='Series'&&t!=='Standalone').slice(0,3)).join(' · ');}
  $('#sheetSub').textContent=`${b.title} by ${b.author}`;
  $('#lpT').textContent=`You liked ${LIKE_COPY[kind][0]}`;
  $('#lpB').textContent=body;
  $('#note').value='';
  $('#scrim').classList.add('show');$('#sheet').classList.add('show');
  setTimeout(()=>$('#confirmBtn').focus(),60);
}
function closeLike(){$('#scrim').classList.remove('show');$('#sheet').classList.remove('show');}
function confirmLike(){
  const b=BOOKS[idx%BOOKS.length];
  shelf.push({id:b.id,liked,note:$('#note').value});
  closeLike();
  $('#shelfN').textContent=shelf.length;$('#shelfBtn').setAttribute('aria-label',`Your shelf, ${shelf.length} books`);
  const sb=$('#shelfBtn');sb.classList.remove('bump');void sb.offsetWidth;sb.classList.add('bump');
  $('#momentCover').innerHTML=coverHtml(b,idx);
  $('#momentP').textContent=`You and ${b.title} are going to get along.`;
  $('#momentWhy').textContent=`Because you loved ${LIKE_COPY[liked][0]} ♡`;
  confetti();
  $('#moment').classList.add('show');setTimeout(()=>$('#momentBtn').focus(),60);
}
function confetti(){
  const m=$('#moment');m.querySelectorAll('.confetti').forEach(c=>c.remove());
  const cols=['#c7a9b5','#7F9D98','#5C7EA0','#E9B9C8','#C98A1B','#555B3F'];
  for(let i=0;i<26;i++){const c=document.createElement('span');c.className='confetti';
    c.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};--dy:${520+Math.random()*320}px;--dx:${(Math.random()-.5)*120}px;--rot:${(Math.random()-.5)*720}deg;animation-delay:${Math.random()*.25}s;${i%3===0?'border-radius:50%;width:10px;height:10px;':''}`;
    m.appendChild(c);}
}
function next(kind){
  past.push({idx,kind});
  const feed=$('#feed');feed.classList.remove('in-right','in-left');void feed.offsetWidth;feed.classList.add('out-left');
  setTimeout(()=>{idx++;render(1);},matchMedia('(prefers-reduced-motion: reduce)').matches?0:260);
}
function undo(){
  const h=past.pop();if(!h)return;
  if(h.kind==='like'){shelf.pop();$('#shelfN').textContent=shelf.length;}
  idx=h.idx;render(-1);toast('Brought it back');
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

document.addEventListener('click',e=>{
  const like=e.target.closest('.like');if(like){if(like.dataset.like==='cover')burst();openLike(like.dataset.like);return;}
  const v=e.target.closest('.vibe');if(v){v.setAttribute('aria-pressed',String(v.getAttribute('aria-pressed')!=='true'));return;}
  if(!e.target.closest('#menu')&&!e.target.closest('#moreBtn')){const m=$('#menu');if(m)m.classList.remove('show');}
});
$('#passBtn').onclick=()=>next('pass');
$('#undoBtn').onclick=undo;
$('#confirmBtn').onclick=confirmLike;
$('#cancelBtn').onclick=closeLike;$('#scrim').onclick=closeLike;
$('#momentBtn').onclick=()=>{$('#moment').classList.remove('show');past.push({idx,kind:'like'});idx++;render(1);};
$('#shelfBtn').onclick=()=>toast(shelf.length?`${shelf.length} book${shelf.length>1?'s':''} on your shelf`:'Your shelf is empty, for now');
$('#coachOk').onclick=()=>$('#coach').remove();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLike();$('#moment').classList.remove('show');}});
render(0);
</script>
</body>
</html>
